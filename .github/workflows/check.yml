name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m coverage run -m unittest discover -s tests -v
      - run: python -m coverage report
      - run: python scripts/test-small-disk.py
      - name: Build coverage report
        if: always()
        run: python -m coverage html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
      - run: docker compose --env-file .env.example --profile bot config --quiet
      - run: docker compose --env-file .env.example --profile bot --profile setup --profile web config --format json | python scripts/check-isolation.py
      - run: docker compose --env-file .env.small.example --profile bot --profile setup --profile web config --format json | python scripts/check-isolation.py
      - run: docker build -t video-saver-bot:test .
